name: Merge Release Preparation

on:
  workflow_run:
    workflows: [Validate Extension]
    types: [completed]

permissions:
  contents: read
  pull-requests: read

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'release-prep/') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: merge-release-prep-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify the tested release-prep PR
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/merge-release-prep.js
      - name: Validate release app configuration
        if: steps.candidate.outputs.number != ''
        env:
          RELEASE_APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "${RELEASE_APP_CLIENT_ID}" || -z "${RELEASE_APP_PRIVATE_KEY}" ]]; then
            echo "::error::Configure repository Actions variable RELEASE_APP_CLIENT_ID and secret RELEASE_APP_PRIVATE_KEY before merging a release."
            exit 1
          fi
      - uses: actions/create-github-app-token@v3
        if: steps.candidate.outputs.number != ''
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Merge the tested release-prep PR
        if: steps.candidate.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PULL_REQUEST_NUMBER: ${{ steps.candidate.outputs.number }}
          TESTED_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          merged="$(gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}/merge" \
            -f merge_method=squash -f sha="${TESTED_SHA}" --jq .merged)"
          if [[ "${merged}" != "true" ]]; then
            echo "::error::GitHub did not merge release-prep PR #${PULL_REQUEST_NUMBER}."
            exit 1
          fi
          echo "Merged release-prep PR #${PULL_REQUEST_NUMBER} at ${TESTED_SHA}."
