name: Publish Dev Pre-release

on:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: dev-pre-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate and package pre-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.prerelease.outputs.version }}
      stable_version: ${{ steps.prerelease.outputs.stable_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Resolve pre-release version
        id: prerelease
        run: |
          stable_version="$(git show origin/main:package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"
          version="$(node .github/scripts/prepare-prerelease.js version "$stable_version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "stable_version=${stable_version}" >> "$GITHUB_OUTPUT"
          npm version "$version" --no-git-tag-version --ignore-scripts
      - run: npm run lint
      - run: npm run test:unit
      - run: xvfb-run -a npm run test:e2e
      - name: Generate pre-release notes and changelog
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE_TAG: pre-release/${{ steps.prerelease.outputs.version }}
          PRERELEASE_VERSION: ${{ steps.prerelease.outputs.version }}
          STABLE_VERSION: ${{ steps.prerelease.outputs.stable_version }}
        run: |
          previous_tag=""
          if git rev-parse --quiet --verify "refs/tags/${STABLE_VERSION}" >/dev/null; then
            previous_tag="${STABLE_VERSION}"
          elif git rev-parse --quiet --verify "refs/tags/v${STABLE_VERSION}" >/dev/null; then
            previous_tag="v${STABLE_VERSION}"
          fi

          notes_args=(-f "tag_name=${PRERELEASE_TAG}" -f "target_commitish=${GITHUB_SHA}")
          if [[ -n "${previous_tag}" ]]; then
            notes_args+=(-f "previous_tag_name=${previous_tag}")
          fi

          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" "${notes_args[@]}" --jq .body > pre-release-notes.md
          node .github/scripts/prepare-prerelease.js changelog "${PRERELEASE_VERSION}" "${STABLE_VERSION}" pre-release-notes.md
      - run: npm run package -- --pre-release
      - uses: actions/upload-artifact@v7
        with:
          name: tab-group-prerelease-${{ steps.prerelease.outputs.version }}
          path: |
            *.vsix
            pre-release-notes.md
          if-no-files-found: error

  publish:
    name: Publish pre-release
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: marketplace-prerelease
      url: https://marketplace.visualstudio.com/items?itemName=jiapeiyao.tab-group
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: tab-group-prerelease-${{ needs.validate.outputs.version }}
          path: release
      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          vsix_path="$(find release -maxdepth 1 -name '*.vsix' -print -quit)"
          test -n "${vsix_path}"
          npx --no-install vsce publish --pre-release --skip-duplicate --packagePath "${vsix_path}"
      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: pre-release/${{ needs.validate.outputs.version }}
          RELEASE_TITLE: '${{ needs.validate.outputs.version }} (Pre-release)'
        run: |
          vsix_path="$(find release -maxdepth 1 -name '*.vsix' -print -quit)"
          test -n "${vsix_path}"
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${vsix_path}" --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${RELEASE_TAG}" "${vsix_path}" --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --prerelease --title "${RELEASE_TITLE}" --notes-file release/pre-release-notes.md
          fi
