name: Publish Tagged Release

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing X.Y.Z or vX.Y.Z tag to validate and package
        required: true
        type: string
      publish:
        description: Publish the selected tag to Marketplace after approval
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  validate:
    name: Build tagged release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: xvfb-run -a npm run test:e2e
      - name: Verify selected tag matches extension version
        run: |
          git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}"
          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          package_version="$(node -p "require('./package.json').version")"
          test "$(git rev-parse HEAD)" = "${tag_commit}"
          test "${RELEASE_TAG#v}" = "${package_version}"
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: tab-group-${{ env.RELEASE_TAG }}-vsix
          path: '*.vsix'
          if-no-files-found: error

  attach-release-asset:
    name: Attach VSIX to GitHub Release
    if: ${{ github.event_name == 'push' }}
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tab-group-${{ env.RELEASE_TAG }}-vsix
          path: release
      - name: Create or update GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          vsix_path="$(find release -maxdepth 1 -name '*.vsix' -print -quit)"
          test -n "${vsix_path}"
          if ! gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --verify-tag --title "${RELEASE_TAG}" --generate-notes || gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}"
          fi
          gh release upload "${RELEASE_TAG}" "${vsix_path}" --repo "${GITHUB_REPOSITORY}" --clobber

  publish:
    name: Publish tagged release
    if: ${{ github.event_name == 'push' || inputs.publish }}
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: marketplace-publish
      url: https://marketplace.visualstudio.com/items?itemName=jiapeiyao.tab-group
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: tab-group-${{ env.RELEASE_TAG }}-vsix
          path: release
      - name: Publish packaged extension
        run: npx --no-install vsce publish --packagePath "$(find release -maxdepth 1 -name '*.vsix' -print -quit)"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
